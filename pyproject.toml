[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trafisec"
version = "1.0.0"
description = "TraceGuard-DeFi (TraFiSec): Validity-Aware Screening and Counterfactual Replay for DeFi Security Incident Triage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thanh-Dat Vuong", email = "22521569@gm.uit.edu.vn" },
    { name = "Ba-Quan Nguyen", email = "22521120@gm.uit.edu.vn" },
    { name = "Tuan-Dung Tran", email = "trandung@uit.edu.vn" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "web3>=6.0.0",
    "eth-abi>=4.0.0",
    "eth-utils>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pymupdf>=1.23.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]
